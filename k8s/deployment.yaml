apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes-api
  labels:
    app: cloudnotes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudnotes-api
  template:
    metadata:
      labels:
        app: cloudnotes-api
    spec:
      containers:
        - name: cloudnotes-api
          # Replace DOCKERHUB_USERNAME with the Docker Hub account used by CI.
          image: docker.io/DOCKERHUB_USERNAME/cloudnotes-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudnotes-api
spec:
  selector:
    app: cloudnotes-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
